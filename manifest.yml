type: install
name: Docker Compose from GitHub
tooltip: Install Docker Compose from GitHub repository.

settings:
  fields:
    - caption: GitHub Repository
      type: string
      name: repo
      placeholder: username/repo
      required: true
      regex: ^[a-zA-Z0-9-]+/[a-zA-Z0-9-]+$
    - caption: GitHub Branch
      type: string
      name: branch
      default: main
    - caption: Access Token
      type: string
      name: token
      inputType: password
    - type: spacer
    - caption: Docker Compose
      type: string
      name: compose
      default: docker-compose.yaml
      required: true
    - caption: Generate Directus variables
      type: toggle
      name: directus
      default: true
      required: false
      tooltip: "Automatically generate Directus environment variables."
    - caption: Environment Variables
      type: text
      name: env
      required: false
      default: "LETSENCRYPT_EMAIL=contact@apenhet.com"
    - type: spacer
    - caption: DNS Recods (Infomaniak)
      type: toggle
      name: dns
      default: true
      required: false
      tooltip: "Automatically add DNS records."
      showIf:
        true:
          - caption: DNS Token
            type: string
            name: dnsToken
            inputType: password
            required: true
    - caption: NGINX
      type: toggle
      name: nginx
      default: true
      required: false
      tooltip: "Automatically generate NGINX configuration."
      showIf:
        true:
          - caption: NGINX Mapping
            type: text
            name: domains
            tooltip: "Domain <-> Server mapping: 'domain:service'."
            default: "admin.foo.apenhet.org:directus,foo.apenhet.org:nuxt"

nodes:
  - count: 1
    cloudlets: 32
    nodeType: ubuntu22
    nodeGroup: cp
    displayName: Application
    extip: true
    ipv6: true
    env:
      JELASTIC_PORTS: 80,443,9000

skipNodeEmails: true

onInstall:
  - if (${settings.dns}): addDNSRecords
  - cloneRepo
  - createEnvFile
  - createDeployScript
  - installDocker
  - installWebhook
  - runDeployScript

actions:
  addDNSRecords:
    cmd[cp]: |-
      LIST="${settings.domains}"

      IFS=',' read -r -d '' -a DOMAINS <<< "$(echo "$LIST")"

      for DOMAIN in "${DOMAINS[@]}"; do
          IFS=':' read -r -a DOMAIN <<< "$DOMAIN"
          MAIN=$(echo "$DOMAIN" | rev | cut -d '.' -f 1-2 | rev)
          SUB=$(echo "$DOMAIN" | sed "s/\.$MAIN//")
          curl -X POST \
          -H "Authorization: Bearer ${settings.dnsToken}" \
          -H "Content-Type: application/json" \
          -d '{
              "target": "'${nodes.cp.master.extips[0]}'",
              "ttl": "3600",
              "type": "A",
              "source": "'$SUB'"
          }' \
          https://api.infomaniak.com/2/zones/$MAIN/records
      done

  cloneRepo:
    cmd[cp]: |-
      # Install GitHub
      sudo apt-get --assume-yes install git

      # Clone the repository
      if [ -n "${settings.token}" ]; then
          git clone -b ${settings.branch} https://${settings.token}@github.com/${settings.repo}.git /home/jelastic/app
      else
          git clone -b ${settings.branch} https://github.com/${settings.repo}.git /home/jelastic/app
      fi

  createEnvFile:
    cmd[cp]: |-
      if [ "${settings.directus}" = "true" ]; then
          # Generate Directus environment variables
          echo "DB_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)" >> /.jelenv
          echo "DIRECTUS_KEY=$(openssl rand -base64 32)" >> /.jelenv
          echo "DIRECTUS_SECRET=$(openssl rand -base64 64 | tr -d '\n')" >> /.jelenv         
          echo "ADMIN_EMAIL=yasser.lahbibi@apenhet.com" >> /.jelenv
          echo "ADMIN_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)" >> /.jelenv
      fi

      LIST="${settings.domains}"

      IFS=',' read -r -d '' -a DOMAINS <<< "$(echo "$LIST")"

      for DOMAIN in "${DOMAINS[@]}"; do
        SERVICE=$(echo "$DOMAIN" | cut -d ':' -f 2 | tr '.' '_' | tr '[:lower:]' '[:upper:]')
        HOST=$(echo "$DOMAIN" | cut -d ':' -f 1)
        echo "${SERVICE}_HOST=${HOST}" >> /.jelenv
        echo "${SERVICE}_URL=https://${HOST}" >> /.jelenv
      done

      if [ -n "${settings.env}" ]; then
          echo -e "\n${settings.env}" >> /.jelenv
      fi

  createDeployScript:
    cmd[cp]: |-
      cat > /home/jelastic/deploy.sh <<EOF
      #!/bin/bash
      cd /home/jelastic/app

      # Pull the latest changes
      git pull origin ${settings.branch}
      
      # Copy .jelenv to the home directory
      cp /.jelenv /home/jelastic/app/.env -f

      # Build the Docker images
      docker compose -f ${settings.compose} build
      
      # Use docker rollout to update the services
      LIST="${settings.domains}"

      IFS=',' read -r -d '' -a DOMAINS <<< "\$(echo "\$LIST")"

      for DOMAIN in "\${DOMAINS[@]}"; do
        SERVICE=\$(echo "\$DOMAIN" | cut -d ':' -f 2 | tr '.' '_')
        docker rollout -f ${settings.compose} \$SERVICE
      done

      EOF

      chmod +x /home/jelastic/deploy.sh


  installDocker:
    cmd[cp]: |-
      # Add Docker's official GPG key:
      sudo apt-get update
      sudo apt-get --assume-yes install ca-certificates curl
      sudo install -m 0755 -d /etc/apt/keyrings
      sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      sudo chmod a+r /etc/apt/keyrings/docker.asc

      # Add the repository to Apt sources:
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      sudo apt-get --assume-yes update

      # Install Docker
      sudo apt-get --assume-yes install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # Create directory for Docker cli plugins
      mkdir -p ~/.docker/cli-plugins

      # Download docker-rollout script to Docker cli plugins directory
      curl https://raw.githubusercontent.com/wowu/docker-rollout/main/docker-rollout -o ~/.docker/cli-plugins/docker-rollout

      # Make the script executable
      chmod +x ~/.docker/cli-plugins/docker-rollout

      # Start Docker
      sudo systemctl start docker

  installWebhook:
    cmd[cp]: |-
      # Create a webhook on GitHub
      curl -X POST -H "Authorization: Bearer ${settings.token}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${settings.repo}/hooks -d '{"name": "web", "active": true, "events": ["push"], "config": {"url": "http://${env.domain}:9000/hooks/github", "content_type": "json"}}'

      # Install webhook
      sudo apt-get install --assume-yes webhook

      # Create a hooks.json file
      cat > /home/jelastic/hooks.json <<EOF
      [
        {
          "id": "github",
          "execute-command": "/home/jelastic/deploy.sh",
          "command-working-directory": "/home/jelastic",
          "response-message": "Redeploying...",
          "trigger-rule": {
            "match": { 
              "value": "refs/heads/${settings.branch}", 
              "type": "value", 
              "parameter": {
                "source": "payload",
                "name": "ref"
              }
            }
          }
        }
      ]
      EOF

      # Create webhook service
      cat > /etc/systemd/system/webhook.service <<EOF
      [Unit]
      Description=webhook

      [Service]
      ExecStart=webhook -hooks /home/jelastic/hooks.json -verbose
      Restart=always

      [Install]
      WantedBy=multi-user.target
      EOF

      # Reload systemd
      sudo systemctl daemon-reload

      # Start webhook service
      sudo systemctl start webhook

      # Enable webhook service
      sudo systemctl enable webhook

  runDeployScript:
    cmd[cp]: |-
      cd /home/jelastic && bash deploy.sh